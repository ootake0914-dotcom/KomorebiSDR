name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build native core (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /W3 /LD sdr_core.c /Fe:sdr_core.dll /link /INCREMENTAL:NO

      - name: Run tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/run_all.py
